log4j.rootLogger=ERROR, file
log4j.logger.com.permata.appraisal2=ERROR, file
log4j.logger.org.springframework=ERROR, file
log4j.logger.org.springframework.security=ERROR, file
log4j.logger.org.hibernate=ERROR, file
log4j.logger.org.apache=ERROR, file

#log4j.rootLogger=DEBUG, CONSOLE
#log4j.logger.com.permata.appraisal2=DEBUG, CONSOLE
#log4j.logger.org.springframework=ERROR, CONSOLE
#log4j.logger.org.springframework.security=INFO, CONSOLE
#log4j.logger.org.hibernate=TRACE, CONSOLE
#log4j.logger.org.apache=ERROR, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.conversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p - %m%n

# Redirect log messages to a log file
log4j.appender.file=org.apache.log4j.RollingFileAppender
#outputs to Tomcat home
log4j.appender.file.File=${catalina.home}/logs/appraisal.log
#prod log file
#log4j.appender.file.File=C:/Appraisal Tomcat/logs/appraisal.log
log4j.appender.file.MaxFileSize=2MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

